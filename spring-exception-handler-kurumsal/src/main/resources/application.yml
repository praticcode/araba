spring:
  application:
    name: spring-exception-handler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/mhuys?currentSchema=araba}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: araba
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.kurum.personel: INFO
